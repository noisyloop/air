name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: air
          POSTGRES_PASSWORD: air
          POSTGRES_DB: air
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U air" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://air:air@localhost:5432/air?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run db:seed
        working-directory: apps/api
      - name: Tests (unit + API integration)
        run: npm test
        env:
          AIR_TEST_DB: postgresql://air:air@localhost:5432/air?schema=public
      - run: npm run build
